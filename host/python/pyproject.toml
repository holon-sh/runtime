[project]
name = "holon-host"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["holon-sh==0.0.1.dev9", "mcp==2.3.0", "mypy==2.4.0", "ruff==0.16.8"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
local_partial_types = true
files = ["."]
explicit_package_bases = true

[tool.ruff]
target-version = "py311"
