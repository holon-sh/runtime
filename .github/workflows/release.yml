name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/ci.yml
  development-image:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/bake-action@v7
        with:
          files: development/release.hcl
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.1
      - name: Publish the worker and its production bases
        env:
          DEST: out/development
          IMAGE: ghcr.io/holon-sh/development:${{ github.ref_name }}
        run: |
          digest=$(python3 development/package.py pack "$DEST/core" "$DEST/layers")
          oras cp --from-oci-layout "$DEST/core:release" "$IMAGE"
          test "$(oras resolve "$IMAGE")" = "$digest"
          echo "ghcr.io/holon-sh/development@$digest" >> "$GITHUB_STEP_SUMMARY"
