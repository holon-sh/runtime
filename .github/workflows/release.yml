name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/ci.yml
  development-image:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the development image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: development/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/holon-sh/development:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report the digest the holon chart pins
        run: echo "ghcr.io/holon-sh/development@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
