name: Cold worker
on:
  pull_request:
    paths: ['development/check/cold.py', 'development/check/workers.json', '.github/workflows/cold-worker.yml']
permissions:
  contents: read
  packages: read
jobs:
  cold:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.1
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: PATH="$(go env GOPATH)/bin:$PATH" python3 development/check/cold.py
