name: Source image
on:
  pull_request:
    paths: ['development/**', 'host/**', 'cmd/**', 'go.*', '.github/workflows/source-image.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: holon-sh/cli
          ref: 755f19bb78a017fd6dff35da741129ed719a811c # v0.0.1-dev.60
          path: .cli
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 9be2c315ff4d6dc5fb860b41c0083bc118f502b0 # v0.0.1-dev.20
          path: .baseline
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .cli/go.mod
      - uses: docker/setup-buildx-action@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.1"
      - name: Install k3d
        run: |
          case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
          curl -fsSLo "$RUNNER_TEMP/k3d-linux-$arch" "https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-$arch"
          curl -fsSLo "$RUNNER_TEMP/checksums.txt" "https://github.com/k3d-io/k3d/releases/download/v5.9.0/checksums.txt"
          (cd "$RUNNER_TEMP" && sed -n "s@_dist/\(k3d-linux-$arch\)\$@\1@p" checksums.txt | sha256sum -c -)
          sudo install "$RUNNER_TEMP/k3d-linux-$arch" /usr/local/bin/k3d
      - run: python3 development/check/cluster.py .cli .baseline
