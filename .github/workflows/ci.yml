name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
env:
  UV_VERSION: "0.13.1"
jobs:
  adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/javascript/package-lock.json
      - name: Embedded JavaScript adapter is up to date
        run: |
          npm --prefix host/javascript ci --ignore-scripts
          npm --prefix host/javascript run build
          git diff --exit-code host/javascript/adapter.bundle.mjs
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Lint and type-check the Python adapter
        working-directory: host/python
        run: |
          uv run --frozen ruff check . && uv run --frozen ruff format --check .
          uv run --frozen mypy
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: shellcheck scripts/build-runtime
      - run: scripts/build-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-payloads
          path: dist/*
          if-no-files-found: error
  runtimes:
    needs: test
    name: Go application host (${{ matrix.runtime }} ${{ matrix.version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runtime: node, version: 22.20.0}
          - {runtime: node, version: 22.x}
          - {runtime: node, version: 24.0.0}
          - {runtime: node, version: 24.x}
          - {runtime: bun, version: 1.2.0}
          - {runtime: bun, version: 1.3.14}
          - {runtime: deno, version: 2.8.0}
          - {runtime: deno, version: v2.x}
          - {runtime: python, version: "3.11"}
          - {runtime: python, version: "3.14"}
          - {runtime: python, version: "3.15"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.runtime == 'node' && matrix.version || '22.20.0' }}
      - uses: actions/download-artifact@v4
        with:
          name: runtime-payloads
          path: dist
      - run: install -m 755 dist/holon-mcp-runtime-linux-amd64 host/javascript/.host-test
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: ${{ matrix.version }}
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: ${{ matrix.version }}
      - uses: astral-sh/setup-uv@v10.2.0
        if: matrix.runtime == 'python'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.version }}
      - run: uv sync --frozen
        if: matrix.runtime == 'python'
        working-directory: host/python
      - run: npm --prefix host/javascript ci --ignore-scripts
      - run: node --test host.test.mjs
        working-directory: host/javascript
        env:
          HOLON_TEST_RUNTIME: ${{ matrix.runtime == 'python' && format('{0}/host/python/.venv/bin/python', github.workspace) || matrix.runtime }}
