name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: shellcheck scripts/build-runtime
      - run: scripts/build-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-payloads
          path: dist/*
          if-no-files-found: error
